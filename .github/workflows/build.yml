name: Building Security Pipeline

on: 
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_TAR: ${{ github.sha }}.tar

jobs:
  # Detect Secret
  detect-secrets:
    name: Detect Secret
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Verify baseline and setup
        run: |
          if [ ! -f ".secrets.baseline" ]; then
            echo "The file .secret.baseline does not exist"
            echo "Make sure to create and upload this first... existing"
            exit 1
          fi
          mkdir -p reports

      # compare latest commit file
      - name: Run detect-secrets scan
        run: | 
          COMMIT_BEFORE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo ${{ github.sha }})
          echo "Scanning changed files between ${COMMIT_BEFORE_SHA} and ${{ github.sha }}..."

          git diff --name-only --diff-filter=d $COMMIT_BEFORE_SHA ${{ github.sha }} | \
          xargs detect-secrets-hook --baseline .secrets.baseline > reports/detect-secrets-report.txt

      - name: Reporting
        if: always()
        run: |
          if [ -f "reports/detect-secrets-report.txt"]; then
            cat reports/detect-secrets-report.txt
          fi

      - name: Upload Detect-Secrets Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detect-secrets-report
          path: reports/detect-secrets-report.txt

  sast:
    name: Code & Dockerfile check
    runs-on: ubuntu-latest
    needs: [detect-secrets]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug Check if files exists
        run: |
          echo "Current Directory"
          ls -la
          echo "Check Juice-Shop Directory"
          ls -la juice-shop || echo "juice-shop folder not found!"
          echo "Dockerfile"
          find . -name "Dockerfile"

      - name: Run Hadolint and Generate Reports
        continue-on-error: true
        run: |
          mkdir -p reports
          docker run --rm -i hadolint/hadolint:latest hadolint --no-fail - < juice-shop/Dockerfile > reports/hadolint-report.txt
          docker run --rm -i hadolint/hadolint:latest hadolint --failure-threshold warning -f sonarqube - < juice-shop/Dockerfile > reports/hadolint-report.json || true

      # njsscan doesn't scan TypeScript (real reason it finds nothing)
      - name: Run njsscan
        continue-on-error: true
        run: | 
          mkdir -p reports
          pip install njsscan
          
          cd juice-shop
          echo "=== Scanning Juice Shop ==="
          
          njsscan --output ../reports/njsscan-report.txt . || true
          njsscan --exit-warning --sonarqube --output ../reports/njsscan-report.json . || true
          
          cd ..

      - name: Run Semgrep
        continue-on-error: true
        run: | 
          pip install semgrep
          semgrep scan --config auto --json -o reports/semgrep-report.json ./juice-shop || true
          semgrep scan --config auto ./juice-shop > reports/semgrep-report.txt || true

      - name: Reporting
        if: always()
        run: | 
          if [ -s "reports/hadolint-report.txt" ]; then
            cat reports/hadolint-report.txt
          fi

          if [ -s "reports/njsscan-report.json" ]; then
            cat reports/njsscan-report.json
          fi

          if [ -s "reports/semgrep-report.json" ]; then
            cat reports/semgrep-report.json
          fi
      
      - name: Upload Hadolint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadoline-report
          path: | 
            reports/hadolint-report.txt
            reports/njsscan-report.json
            reports/semgrep-report.json

  sonarqube:
    runs-on: ubuntu-latest
    needs: [detect-secrets]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        with:
          args: >
            -Dsonar.projectKey=devsecops-practice
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.sources=.
            -Dsonar.exclusions=reports/**,node_modules/**,frontend/dist/**,**/*.spec.ts
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Build Image
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    needs: [detect-secrets, sast, sonarqube]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          DOCKER_BUILDKIT=1 docker build -t ${{ env.IMAGE_TAG }} ./juice-shop
          docker save ${{ env.IMAGE_TAG }} > ${{ env.IMAGE_TAR }}

      - name: Upload Docker Image artifact
        uses: actions/upload-artifact@v4
        with: 
          name: docker-image
          path: ${{ env.IMAGE_TAR }}

  # SCA Dependency check
  dependency-check:
    name: Run Dependency Check
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create report directory
        run: mkdir -p reports

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        #env:
          # Prevent Rate Limited
        #  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        with:
          project: 'devsecops-practice'
          path: './juice-shop'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 6
            --enableExperimental
          #  --nvdApiKey ${{ secrets.NVD_API_KEY }}
      
      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependencycheck-report
          path: | 
            reports/dependencycheck-report.html
    